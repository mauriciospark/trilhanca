<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste Mapa TRILHANÇA</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" />
    
    <!-- CSS do TRILHANÇA -->
    <link rel="stylesheet" href="css/mapa.css" />
    <link rel="stylesheet" href="css/mapa-offline.css" />
    <link rel="stylesheet" href="css/mapa-hybrid-fusion.css" />
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
        }
        
        #test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        #test-results {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        
        .test-pass {
            background: rgba(40, 167, 69, 0.2);
            border-left: 4px solid #28a745;
        }
        
        .test-fail {
            background: rgba(220, 53, 69, 0.2);
            border-left: 4px solid #dc3545;
        }
        
        .test-warning {
            background: rgba(255, 193, 7, 0.2);
            border-left: 4px solid #ffc107;
        }
        
        #map {
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .error-details {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="test-container">
        <h1>🧪 Teste do Mapa TRILHANÇA</h1>
        
        <div id="test-results">
            <h2>Resultados dos Testes</h2>
            <div id="test-list"></div>
        </div>
        
        <div id="map-container">
            <h2>Mapa Teste</h2>
            <div id="map"></div>
        </div>
        
        <div id="error-container" style="display: none;">
            <h2>Erros Encontrados</h2>
            <div id="error-details" class="error-details"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.js"></script>
    
    <!-- Scripts do TRILHANÇA -->
    <script src="js/mapa-offline.js"></script>
    <script src="js/mapa-hybrid-fusion.js"></script>
    <script src="js/mapa-integration.js"></script>
    
    <script>
        // Sistema de testes
        class MapaTester {
            constructor() {
                this.tests = [];
                this.results = [];
            }
            
            addTest(name, testFunction) {
                this.tests.push({ name, testFunction });
            }
            
            async runTests() {
                console.log('🧪 Iniciando testes do mapa...');
                
                for (const test of this.tests) {
                    try {
                        const result = await test.testFunction();
                        this.results.push({
                            name: test.name,
                            status: 'pass',
                            message: result || 'Teste passou'
                        });
                    } catch (error) {
                        this.results.push({
                            name: test.name,
                            status: 'fail',
                            message: error.message,
                            error: error
                        });
                    }
                }
                
                this.displayResults();
            }
            
            displayResults() {
                const testList = document.getElementById('test-list');
                testList.innerHTML = '';
                
                let passCount = 0;
                let failCount = 0;
                
                this.results.forEach(result => {
                    const div = document.createElement('div');
                    div.className = `test-item test-${result.status}`;
                    div.innerHTML = `
                        <strong>${result.name}:</strong> ${result.message}
                    `;
                    testList.appendChild(div);
                    
                    if (result.status === 'pass') passCount++;
                    else failCount++;
                });
                
                // Adicionar resumo
                const summary = document.createElement('div');
                summary.className = 'test-item';
                summary.style.background = 'rgba(255, 255, 255, 0.1)';
                summary.innerHTML = `
                    <strong>Resumo:</strong> ${passCount} passaram, ${failCount} falharam
                `;
                testList.appendChild(summary);
                
                // Mostrar erros se houver
                if (failCount > 0) {
                    this.showErrors();
                }
            }
            
            showErrors() {
                const errorContainer = document.getElementById('error-container');
                const errorDetails = document.getElementById('error-details');
                
                errorContainer.style.display = 'block';
                errorDetails.innerHTML = '';
                
                this.results
                    .filter(r => r.status === 'fail')
                    .forEach(result => {
                        const errorDiv = document.createElement('div');
                        errorDiv.innerHTML = `
                            <strong>${result.name}:</strong>
                            ${result.message}
                            ${result.error && result.error.stack ? '\n' + result.error.stack : ''}
                        `;
                        errorDetails.appendChild(errorDiv);
                    });
            }
        }
        
        // Criar instância do tester
        const tester = new MapaTester();
        
        // Adicionar testes
        tester.addTest('Verificar classes globais', () => {
            if (!window.TrilhancaMapOffline) {
                throw new Error('Classe TrilhancaMapOffline não encontrada');
            }
            if (!window.VehicleMarkers) {
                throw new Error('Classe VehicleMarkers não encontrada');
            }
            if (!window.WaypointManager) {
                throw new Error('Classe WaypointManager não encontrada');
            }
            return 'Todas as classes globais encontradas';
        });
        
        tester.addTest('Verificar inicialização do mapa', () => {
            if (!window.trilhancaMap) {
                throw new Error('Instância do mapa não encontrada');
            }
            if (!window.trilhancaMap.map) {
                throw new Error('Mapa Leaflet não inicializado');
            }
            return 'Mapa inicializado com sucesso';
        });
        
        tester.addTest('Verificar subsistemas', () => {
            const map = window.trilhancaMap;
            
            if (!map.vehicleMarkers) {
                throw new Error('VehicleMarkers não inicializado');
            }
            if (!map.waypointManager) {
                throw new Error('WaypointManager não inicializado');
            }
            if (!map.gpsTracker) {
                throw new Error('GPSTracker não inicializado');
            }
            if (!map.convoyAlerts) {
                throw new Error('ConvoyAlerts não inicializado');
            }
            return 'Todos os subsistemas inicializados';
        });
        
        tester.addTest('Testar adição de veículo', () => {
            const testVehicle = {
                id: 'test_vehicle_001',
                name: 'Veículo Teste',
                role: 'member',
                position: { lat: -23.5505, lng: -46.6333 },
                status: 'Ativo',
                distance: 0
            };
            
            try {
                window.trilhancaMap.addConvoyMember(testVehicle);
                
                // Verificar se foi adicionado
                const member = window.trilhancaMap.convoyMembers.find(m => m.id === testVehicle.id);
                if (!member) {
                    throw new Error('Veículo não foi adicionado à lista');
                }
                
                return 'Veículo adicionado com sucesso';
            } catch (error) {
                throw new Error(`Erro ao adicionar veículo: ${error.message}`);
            }
        });
        
        tester.addTest('Testar adição de waypoint', () => {
            const testWaypoint = {
                name: 'Waypoint Teste',
                position: { lat: -23.5480, lng: -46.6300 },
                type: 'GAS',
                description: 'Teste de waypoint'
            };
            
            try {
                window.trilhancaMap.waypointManager.addWaypoint(testWaypoint);
                
                // Verificar se foi adicionado
                const waypoint = window.trilhancaMap.waypointManager.waypoints.find(w => w.name === testWaypoint.name);
                if (!waypoint) {
                    throw new Error('Waypoint não foi adicionado à lista');
                }
                
                return 'Waypoint adicionado com sucesso';
            } catch (error) {
                throw new Error(`Erro ao adicionar waypoint: ${error.message}`);
            }
        });
        
        tester.addTest('Verificar sistema híbrido', () => {
            if (!window.mapaFusion) {
                throw new Error('Sistema híbrido não inicializado');
            }
            if (!window.mapaFusion.connectionMonitor) {
                throw new Error('Monitor de conexão não inicializado');
            }
            return 'Sistema híbrido funcionando';
        });
        
        tester.addTest('Verificar integração', () => {
            if (!window.mapaIntegration) {
                throw new Error('Sistema de integração não inicializado');
            }
            return 'Sistema de integração funcionando';
        });
        
        // Aguardar DOM e inicializar testes
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Iniciando testes...');
            
            // Aguardar um pouco para o mapa inicializar
            setTimeout(async () => {
                await tester.runTests();
            }, 3000);
        });
        
        // Capturar erros globais
        window.addEventListener('error', (event) => {
            console.error('❌ Erro global capturado:', event.error);
            
            const errorContainer = document.getElementById('error-container');
            const errorDetails = document.getElementById('error-details');
            
            if (errorContainer && errorDetails) {
                errorContainer.style.display = 'block';
                const errorDiv = document.createElement('div');
                errorDiv.innerHTML = `
                    <strong>Erro Global:</strong>
                    ${event.error.message}
                    ${event.error.stack ? '\n' + event.error.stack : ''}
                `;
                errorDetails.appendChild(errorDiv);
            }
        });
        
        // Capturar erros de Promise
        window.addEventListener('unhandledrejection', (event) => {
            console.error('❌ Promise rejeitada:', event.reason);
            
            const errorContainer = document.getElementById('error-container');
            const errorDetails = document.getElementById('error-details');
            
            if (errorContainer && errorDetails) {
                errorContainer.style.display = 'block';
                const errorDiv = document.createElement('div');
                errorDiv.innerHTML = `
                    <strong>Promise Rejeitada:</strong>
                    ${event.reason}
                `;
                errorDetails.appendChild(errorDiv);
            }
        });
    </script>
</body>
</html>
