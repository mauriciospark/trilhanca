<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Comunicações • Trilhança</title>
  <link rel="stylesheet" href="../css/Comunicações.css">
  <link rel="shortcut icon" href="../icon/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
            <img src="../icon/favicon.ico" alt="Logo Trilhança">
        </div>
        <div class="titles">
          <h1>TRILHANÇA</h1>
          <div class="subtitle">Comunicações de Comboio</div>
        </div>
      </div>
      <div class="statusbar">
        <div class="badge">Comboio 4</div>
        <div class="badge mesh">MESH ACTIVA</div>
      </div>
    </header>
    <main class="content">
      <section class="alert">
        <div class="alert-title">PERIGO CRÍTICO • VISIBILIDADE ZERO</div>
        <div class="alert-desc">Trecho interditado • Somente 4x4</div>
        <div class="alert-actions">
          <button class="btn alt" id="alt-routes">Ver rotas alternativas</button>
        </div>
      </section>
      <section class="quick-actions">
        <button class="sos" id="sos-sms">SOS SMS</button>
        <button class="ptt-fab" id="ptt-fab">
          <span class="mic"></span>
          <span class="label">RÁDIO PTT</span>
        </button>
        <button class="sat" id="sat-status">Conectividade Satélite</button>
      </section>
      <section class="navlinks" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <a class="btn" href="../html/perfil.html">Perfil</a>
        <a class="btn" href="../html/mapa.html">Mapa</a>
      </section>
      <section class="participants">
        <div class="chips" id="targets">
          <button class="chip selected" data-id="todos" id="target-todos">Todos</button>
        </div>
        <div class="status" id="target-status">Enviando para Todos</div>
      </section>
    
    </main>
    <!-- Removido: compositor de texto; o comunicador é apenas PTT (áudio) -->
  </div>
  <script src="../js/Comunicações.js"></script>
</body>
</html>
