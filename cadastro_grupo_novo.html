<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Grupo • Trilhança</title>
  <link rel="icon" href="./favicoico/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/cadastro_grupo.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img src="./favicoico/android-chrome-192x192.png" alt="Trilhança">
        <h1>Trilhança</h1>
      </div>
    </header>

    <main>
      <form id="group-form">
        <section class="card">
          <h2 class="card-title">
            <i class="fas fa-users"></i>
            Informações do Grupo
          </h2>
          
          <div class="cover-upload">
            <div class="cover-upload">
              <div class="form-group">
                <label for="grupo-foto">Foto do Grupo</label>
                <input type="file" id="grupo-foto" accept="image/*">
              </div>
            </div>
            
            <div class="cover-preview" id="grupo-preview">
              <i class="fas fa-image" style="font-size: 3rem; color: var(--text-muted);"></i>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="grupo-nome">Nome do Grupo</label>
              <input type="text" id="grupo-nome" placeholder="Ex.: Expedição Transamazon 2026" required>
            </div>
            
            <div class="form-group">
              <label for="grupo-codigo">Código do Grupo</label>
              <input type="text" id="grupo-codigo" placeholder="Código único (opcional)">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="partida">Ponto de Partida</label>
              <input type="text" id="partida" placeholder="Ex.: Manaus, AM" required>
            </div>
            
            <div class="form-group">
              <label for="destino">Destino Final</label>
              <input type="text" id="destino" placeholder="Ex.: Belém, PA" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="saida">Data de Saída</label>
              <input type="date" id="saida" required>
            </div>
            
            <div class="form-group">
              <label for="chegada">Previsão de Chegada</label>
              <input type="date" id="chegada">
            </div>
          </div>

          <div class="form-group">
            <label for="descricao">Descrição da Viagem</label>
            <textarea id="descricao" placeholder="Detalhes sobre a viagem, pontos de parada, regras do grupo..."></textarea>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">
            <i class="fas fa-cogs"></i>
            Configurações do Grupo
          </h2>
          
          <div class="form-group">
            <label>Tipo de Veículo Aceito</label>
            <div class="radio-group">
              <div class="radio-item">
                <input type="radio" id="veiculo-4x4" name="veiculo-aceito" value="4x4">
                <label for="veiculo-4x4">Apenas 4x4</label>
              </div>
              <div class="radio-item">
                <input type="radio" id="veiculo-qualquer" name="veiculo-aceito" value="qualquer">
                <label for="veiculo-qualquer">Qualquer veículo</label>
              </div>
              <div class="radio-item">
                <input type="radio" id="veiculo-motos" name="veiculo-aceito" value="motos">
                <label for="veiculo-motos">Apenas Motos</label>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="limite">Limite de Participantes</label>
              <input type="number" id="limite" min="1" step="1" placeholder="Ex.: 10">
            </div>
            
            <div class="form-group">
              <label for="carona">Permite Carona?</label>
              <select id="carona">
                <option value="">Selecione</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
                <option value="condicional">Condicional</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="ritmo">Ritmo do Comboio</label>
            <div class="radio-group">
              <div class="radio-item">
                <input type="radio" id="ritmo-aventureiro" name="ritmo" value="aventureiro">
                <label for="ritmo-aventureiro">Aventureiro</label>
              </div>
              <div class="radio-item">
                <input type="radio" id="ritmo-expresso" name="ritmo" value="expresso">
                <label for="ritmo-expresso">Expresso</label>
              </div>
              <div class="radio-item">
                <input type="radio" id="ritmo-caminhoneiro" name="ritmo" value="caminhoneiro">
                <label for="ritmo-caminhoneiro">Caminhoneiro</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="ponto-encontro">Ponto de Encontro Inicial</label>
            <input type="text" id="ponto-encontro" placeholder="Ex.: Posto BR na saída de Manaus">
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">
            <i class="fas fa-tools"></i>
            Requisitos Obrigatórios
          </h2>
          
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="req-px">
              <label for="req-px">Rádio comunicador (PX/Talkabout)</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="req-combustivel">
              <label for="req-combustivel">Galão de combustível reserva</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="req-estepe">
              <label for="req-estepe">Pneu de estepe extra</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="req-kit">
              <label for="req-kit">Kit de primeiros socorros</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="req-gps">
              <label for="req-gps">GPS funcional</label>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">
            <i class="fas fa-users"></i>
            Membros do Grupo
          </h2>
          
          <div class="members-header">
            <h3>Participantes</h3>
            <button type="button" class="btn btn-secondary" id="add-member">
              <i class="fas fa-plus"></i>
              Adicionar Membro
            </button>
          </div>
          
          <div id="members-list"></div>
        </section>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i>
            Salvar Grupo
          </button>
          <button type="reset" class="btn btn-secondary">
            <i class="fas fa-undo"></i>
            Limpar
          </button>
          <button type="button" class="btn btn-secondary" id="voltar-perfil">
            <i class="fas fa-arrow-left"></i>
            Voltar para Perfil
          </button>
        </div>
      </form>
    </main>

    <div class="share-section hidden" id="share-section">
      <h3 style="margin-bottom: 16px; color: var(--text-primary);">
        <i class="fas fa-share-alt"></i>
        Compartilhar Grupo
      </h3>
      
      <div class="share-link">
        <input type="text" id="share-link-input" readonly>
        <button type="button" class="btn btn-secondary" id="copy-link">
          <i class="fas fa-copy"></i>
          Copiar
        </button>
        <button type="button" class="btn btn-success" id="share-whatsapp">
          <i class="fab fa-whatsapp"></i>
          WhatsApp
        </button>
        <button type="button" class="btn btn-secondary" id="share-sms">
          <i class="fas fa-sms"></i>
          SMS
        </button>
      </div>
    </div>

    <div class="summary hidden" id="summary">
      <i class="fas fa-check-circle"></i>
      Grupo salvo com sucesso!
    </div>
  </div>

  <script>
    // Variáveis globais
    let groupData = null;
    let members = [];

    // Elementos do DOM
    const elements = {
      form: document.getElementById('group-form'),
      summary: document.getElementById('summary'),
      shareSection: document.getElementById('share-section'),
      shareLinkInput: document.getElementById('share-link-input'),
      grupoFoto: document.getElementById('grupo-foto'),
      grupoPreview: document.getElementById('grupo-preview'),
      grupoNome: document.getElementById('grupo-nome'),
      grupoCodigo: document.getElementById('grupo-codigo'),
      partida: document.getElementById('partida'),
      destino: document.getElementById('destino'),
      saida: document.getElementById('saida'),
      chegada: document.getElementById('chegada'),
      descricao: document.getElementById('descricao'),
      veiculo4x4: document.getElementById('veiculo-4x4'),
      veiculoQualquer: document.getElementById('veiculo-qualquer'),
      veiculoMotos: document.getElementById('veiculo-motos'),
      limite: document.getElementById('limite'),
      carona: document.getElementById('carona'),
      ritmoAventureiro: document.getElementById('ritmo-aventureiro'),
      ritmoExpresso: document.getElementById('ritmo-expresso'),
      ritmoCaminhoneiro: document.getElementById('ritmo-caminhoneiro'),
      pontoEncontro: document.getElementById('ponto-encontro'),
      reqPx: document.getElementById('req-px'),
      reqCombustivel: document.getElementById('req-combustivel'),
      reqEstepe: document.getElementById('req-estepe'),
      reqKit: document.getElementById('req-kit'),
      reqGps: document.getElementById('req-gps'),
      membersList: document.getElementById('members-list'),
      addMemberBtn: document.getElementById('add-member'),
      copyLinkBtn: document.getElementById('copy-link'),
      shareWhatsappBtn: document.getElementById('share-whatsapp'),
      shareSmsBtn: document.getElementById('share-sms'),
      voltarBtn: document.getElementById('voltar-perfil')
    };

    // Inicialização
    function init() {
      loadSavedGroup();
      setupEventListeners();
      loadFromURL();
    }

    // Configurar event listeners
    function setupEventListeners() {
      // Preview de foto
      elements.grupoFoto.addEventListener('change', handleImagePreview);
      
      // Form submit
      elements.form.addEventListener('submit', handleSubmit);
      
      // Botões de compartilhamento
      elements.copyLinkBtn.addEventListener('click', copyShareLink);
      elements.shareWhatsappBtn.addEventListener('click', shareViaWhatsApp);
      elements.shareSmsBtn.addEventListener('click', shareViaSMS);
      
      // Botão voltar
      elements.voltarBtn.addEventListener('click', () => {
        window.location.href = 'cadastro_perfil_novo.html';
      });
    }

    // Handle de preview de imagem
    function handleImagePreview(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        elements.grupoPreview.style.backgroundImage = `url(${e.target.result})`;
        elements.grupoPreview.innerHTML = '';
      };
      reader.readAsDataURL(file);
    }

    // Adicionar membro
    function addMember() {
      const member = {
        id: Date.now(),
        name: '',
        photo: null
      };
      
      members.push(member);
      renderMembers();
    }

    // Remover membro
    function removeMember(id) {
      members = members.filter(m => m.id !== id);
      renderMembers();
    }

    // Renderizar membros
    function renderMembers() {
      elements.membersList.innerHTML = '';
      
      members.forEach(member => {
        const memberDiv = document.createElement('div');
        memberDiv.className = 'member-item';
        
        memberDiv.innerHTML = `
          <div class="member-avatar" style="background-image: ${member.photo ? `url(${member.photo})` : 'none'};">
            ${member.photo ? '' : '<i class="fas fa-user" style="color: var(--text-muted);"></i>'}
          </div>
          <input type="text" placeholder="Nome do membro" value="${member.name}" 
                 onchange="updateMemberName(${member.id}, this.value)" 
                 style="background: transparent; border: none; color: var(--text-primary); font-weight: 500;">
          <button type="button" class="member-remove" onclick="removeMember(${member.id})">
            <i class="fas fa-trash"></i>
          </button>
        `;
        
        elements.membersList.appendChild(memberDiv);
      });
    }

    // Atualizar nome do membro
    function updateMemberName(id, name) {
      const member = members.find(m => m.id === id);
      if (member) {
        member.name = name;
      }
    }

    // Carregar grupo salvo
    function loadSavedGroup() {
      try {
        const saved = localStorage.getItem('trilhanca_grupo');
        if (!saved) return;
        
        groupData = JSON.parse(saved);
        populateForm(groupData);
      } catch (error) {
        console.error('Erro ao carregar grupo:', error);
      }
    }

    // Preencher formulário
    function populateForm(data) {
      if (data.nome) elements.grupoNome.value = data.nome;
      if (data.codigo) elements.grupoCodigo.value = data.codigo;
      if (data.partida) elements.partida.value = data.partida;
      if (data.destino) elements.destino.value = data.destino;
      if (data.saida) elements.saida.value = data.saida;
      if (data.chegada) elements.chegada.value = data.chegada;
      if (data.descricao) elements.descricao.value = data.descricao;
      if (data.veiculoAceito) {
        if (data.veiculoAceito === '4x4') elements.veiculo4x4.checked = true;
        if (data.veiculoAceito === 'qualquer') elements.veiculoQualquer.checked = true;
        if (data.veiculoAceito === 'motos') elements.veiculoMotos.checked = true;
      }
      if (data.limite) elements.limite.value = data.limite;
      if (data.carona) elements.carona.value = data.carona;
      if (data.ritmo) {
        if (data.ritmo === 'aventureiro') elements.ritmoAventureiro.checked = true;
        if (data.ritmo === 'expresso') elements.ritmoExpresso.checked = true;
        if (data.ritmo === 'caminhoneiro') elements.ritmoCaminhoneiro.checked = true;
      }
      if (data.pontoEncontro) elements.pontoEncontro.value = data.pontoEncontro;
      if (data.requisitos) {
        if (data.requisitos.px) elements.reqPx.checked = true;
        if (data.requisitos.combustivel) elements.reqCombustivel.checked = true;
        if (data.requisitos.estepe) elements.reqEstepe.checked = true;
        if (data.requisitos.kit) elements.reqKit.checked = true;
        if (data.requisitos.gps) elements.reqGps.checked = true;
      }
      if (data.foto) {
        elements.grupoPreview.style.backgroundImage = `url(${data.foto})`;
        elements.grupoPreview.innerHTML = '';
      }
      if (data.membros) {
        members = data.membros;
        renderMembers();
      }
    }

    // Coletar dados do formulário
    function collectFormData() {
      // Coletar membros com fotos
      const memberInputs = elements.membersList.querySelectorAll('input[type="text"]');
      const membersWithPhotos = members.map((member, index) => {
        const input = memberInputs[index];
        return {
          id: member.id,
          name: input ? input.value : member.name,
          photo: member.photo
        };
      }).filter(m => m.name.trim() !== '');

      return {
        nome: elements.grupoNome.value,
        codigo: elements.grupoCodigo.value,
        partida: elements.partida.value,
        destino: elements.destino.value,
        saida: elements.saida.value,
        chegada: elements.chegada.value,
        descricao: elements.descricao.value,
        veiculoAceito: document.querySelector('input[name="veiculo-aceito"]:checked')?.value || '',
        limite: elements.limite.value,
        carona: elements.carona.value,
        ritmo: document.querySelector('input[name="ritmo"]:checked')?.value || '',
        pontoEncontro: elements.pontoEncontro.value,
        requisitos: {
          px: elements.reqPx.checked,
          combustivel: elements.reqCombustivel.checked,
          estepe: elements.reqEstepe.checked,
          kit: elements.reqKit.checked,
          gps: elements.reqGps.checked
        },
        membros: membersWithPhotos,
        foto: elements.grupoPreview.style.backgroundImage.slice(5, -2) || null
      };
    }

    // Salvar grupo
    function saveGroup() {
      groupData = collectFormData();
      
      try {
        localStorage.setItem('trilhanca_grupo', JSON.stringify(groupData));
        showSummary('Grupo salvo com sucesso!');
        generateShareLink();
        
      } catch (error) {
        showSummary('Erro ao salvar grupo. Tente novamente.', 'error');
      }
    }

    // Gerar link de compartilhamento
    function generateShareLink() {
      if (!groupData) return;
      
      const baseUrl = window.location.origin + window.location.pathname;
      const encodedData = btoa(JSON.stringify(groupData));
      const shareLink = `${baseUrl}?grupo=${encodeURIComponent(encodedData)}`;
      
      elements.shareLinkInput.value = shareLink;
      elements.shareSection.classList.remove('hidden');
    }

    // Carregar da URL
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const grupoParam = params.get('grupo');
      
      if (grupoParam) {
        try {
          const decodedData = JSON.parse(atob(grupoParam));
          populateForm(decodedData);
        } catch (error) {
          console.error('Erro ao decodificar dados da URL:', error);
        }
      }
    }

    // Copiar link
    async function copyShareLink() {
      try {
        await navigator.clipboard.writeText(elements.shareLinkInput.value);
        showSummary('Link copiado para a área de transferência!');
      } catch (error) {
        showSummary('Erro ao copiar link', 'error');
      }
    }

    // Compartilhar via WhatsApp
    function shareViaWhatsApp() {
      if (!groupData) return;
      
      const message = `🚗 *Grupo Trilhança* 🗺️\n\n` +
        `*Nome:* ${groupData.nome}\n` +
        `*Partida:* ${groupData.partida}\n` +
        `*Destino:* ${groupData.destino}\n` +
        `*Saída:* ${groupData.saida}\n` +
        `*Chegada:* ${groupData.chegada || 'A definir'}\n\n` +
        `*Link:* ${elements.shareLinkInput.value}`;
      
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
    }

    // Compartilhar via SMS
    function shareViaSMS() {
      if (!groupData) return;
      
      const message = `Grupo Trilhança: ${groupData.nome} - ${groupData.partida} → ${groupData.destino}. Link: ${elements.shareLinkInput.value}`;
      const smsUrl = `sms:?body=${encodeURIComponent(message)}`;
      window.location.href = smsUrl;
    }

    // Mostrar mensagem
    function showSummary(message, type = 'success') {
      elements.summary.textContent = message;
      elements.summary.className = 'summary';
      elements.summary.style.background = type === 'success' ? 
        'linear-gradient(135deg, var(--success-color) 0%, #1e7e34 100%)' : 
        'linear-gradient(135deg, var(--danger-color) 0%, #8b0000 100%)';
      
      setTimeout(() => {
        elements.summary.classList.add('hidden');
      }, 3000);
    }

    // Handle do submit
    function handleSubmit(event) {
      event.preventDefault();
      saveGroup();
    }

    // Inicializar quando DOM estiver pronto
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
